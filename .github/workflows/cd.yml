name: CD

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: docker.io
  WEB_IMAGE_NAME: kang523/liang-ba
  FRONTEND_IMAGE_NAME: kang523/liang-ba-admin

jobs:
  build:
    name: Build & Deploy
    if: ${{ !contains(github.event.head_commit.message, '[skip-cd]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json

      - name: Set image tag
        id: vars
        run: |
          if [[ ${{ github.ref }} == refs/tags/v* ]]; then
            TAG=${GITHUB_REF#refs/tags/}
          else
            TAG=latest
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Build admin frontend
        working-directory: ./admin
        env:
          VITE_API_BASE_URL: ""
          VITE_BUILD_SOURCEMAP: "false"
        run: |
          npm ci
          npm run build:prod
          ! grep -R "localhost:9999" dist

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}:${{ steps.vars.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: docker/build-push-action@v5
        with:
          context: ./admin
          file: ./admin/Dockerfile.prod
          push: true
          build-args: |
            VITE_API_BASE_URL=
            VITE_BUILD_SOURCEMAP=false
          tags: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ steps.vars.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            set -e

            cd /data/wwwroot/liang_ba
            TAG=${{ steps.vars.outputs.tag }}

            export WEB_IMAGE=${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}:$TAG
            export FRONTEND_IMAGE=${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:$TAG
            docker pull "$WEB_IMAGE"
            docker pull "$FRONTEND_IMAGE"

            mkdir -p staticfiles media logs

            docker compose -f docker-compose.prod.yml up -d redis

            for service in liang_ba_redis; do
              for i in $(seq 1 30); do
                if docker inspect -f '{{.State.Running}}' "$service" 2>/dev/null | grep -q '^true$'; then
                  break
                fi
                sleep 2
              done

              if ! docker inspect -f '{{.State.Running}}' "$service" 2>/dev/null | grep -q '^true$'; then
                echo "$service failed to reach running state"
                docker logs --tail=50 "$service" || true
                exit 1
              fi
            done

            docker compose -f docker-compose.prod.yml run --rm web python manage_prod.py migrate --noinput
            docker compose -f docker-compose.prod.yml run --rm web python manage_prod.py collectstatic --noinput

            docker compose -f docker-compose.prod.yml up -d web frontend nginx

            for service in liang_ba_web liang_ba_frontend liang_ba_nginx; do
              for i in $(seq 1 30); do
                if docker inspect -f '{{.State.Running}} {{.State.Restarting}}' "$service" 2>/dev/null | grep -q '^true false$'; then
                  break
                fi
                sleep 2
              done

              if ! docker inspect -f '{{.State.Running}}' "$service" 2>/dev/null | grep -q '^true$'; then
                echo "$service failed to reach running state"
                docker logs --tail=50 "$service" || true
                exit 1
              fi
            done

            docker compose -f docker-compose.prod.yml exec -T nginx nginx -s reload || docker compose -f docker-compose.prod.yml restart nginx

            if curl -sf -H 'Host: liangbax.com' http://localhost/api/admin/health > /dev/null && \
               curl -sf -H 'Host: console.liangbax.com' http://localhost/ > /dev/null; then
              echo "Deployment successful!"
            else
              docker compose -f docker-compose.prod.yml logs --tail=30
              exit 1
            fi

            docker image prune -f
